<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Document</title>

	<style type="text/css">
	*{margin:0;padding:0;}
	body{font-family: "Hiragino Sans GB","Microsoft Yahei UI","Microsoft Yahei","微软雅黑","Segoe UI",Tahoma,"宋体b8b体",SimSun,sans-serif; font-size: 12px;}
	.login-info{float:right;text-align:right;position: relative;}
	.login-info a:link,.login-info a:visited,.login-info a:active{color:#fff;text-decoration: none;}
    .login-info a:hover{color:#e62129;}
    .login-info{height:40px;line-height:40px;width:160px;font-size:12px;padding-right:40px;}
    .login-info em{color:#fff;display:inline-block;margin: 0 10px;font-style:normal;}
    .login-info a{display:inline-block;}.login-info a:hover{color:#fff;}
   	.login_tip{width:90px;height:auto;border:1px solid #d5d5d5;border-radius: 5px;background: #f8f8f8;box-shadow: 1px 1px 2px rgba(0,0,0,.5);padding:2px;position: absolute;right:20px;top:34px;display:none;}
   	.login_tip a{display: block;height:23px;line-height:23px;text-align: center;}
   	.login_tip a:link,.login_tip a:visited,.login_tip a:active{color:#535353;text-decoration: none;}
   	.login-info a.user_icon{display: inline-block;width:22px;height: 19px;margin-left: 5px;background:url(images/user_ico.png) no-repeat 0 0;}
   	.login_tip a.yellow_btn{display: block;border-radius: 4px;background: #fa8649;color:#fff;height:23px;line-height: 23px;margin:6px 3px 0;font-size:14px;}
   	.mui-mbar-arr{font-family: "宋体"; font-size: 20px; height:20px; 
line-height:20px; position: absolute; text-align: center; 
width: 16px; color: #f8f8f8; right:45%; top:-10px; z-index: 999999; }
   	</style>
<script src="js/jquery-1.7.min.js"></script>
<script >
	$(function(){
		$('.login-info ').mouseenter(function(){
			$(this).find('.login_tip').show();
		});
		$('.login-info ').mouseleave(function(){
			$(this).find('.login_tip').hide();
		});
	});
</script>
</head>
<body style='background:transparent'>
	<div class="login-info " id="loginInfo">
	<a class="first" href='' >我的中原</a> <!--  <a href="" class="user_icon"></a>-->
	<div class="login_tip">
		<div class="mui-mbar-arr">◆</div>
	<a href="" class="yellow_btn">登录</a>
		<a href="">我的委托</a>
		<a href="">我的意向</a>
		<a href="">我的收藏</a>
	</div>
   </div>
</body>
</html>
